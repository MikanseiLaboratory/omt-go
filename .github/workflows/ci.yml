name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        simd: ["scalar", "simd"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      GOEXPERIMENT: ${{ matrix.simd == 'simd' && 'simd' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true
      - name: Test core
        run: go test . ./cmd/...
      - name: Vet
        run: go vet . ./cmd/...

  example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd
      CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Build example
        run: go build ./examples/gio-monitor
